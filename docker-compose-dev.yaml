version: "3.8"

services:

  rabbitmq_dev:
    image: rabbitmq:3-management
    ports:
      #- 5672:5672
      - 15673:15672
    networks:
      - dkb_dev
    command: >
      sh -c "
        rabbitmq-plugins enable --offline rabbitmq_prometheus &&
        rabbitmq-server
      "

  db_dev:
    container_name: db_dev
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-DrBalanc}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-/run/secrets/POSTGRES_PW}
    secrets:
      - POSTGRES_PW
    #ports:
      #- 5432:5432
    restart: always
    networks:
      - dkb_dev
    volumes:
      - db-data:/var/lib/postgresql/data
      - dump-db-data:/docker-entrypoint-initdb.d

  adminer:
    image: adminer
    restart: always
    ports:
      - 7777:8080
    networks:
      - dkb_dev
  
  vk_api_send_dev:
    container_name: vk_api_send_dev
    build:
      context: ./VK_API_SEND_SERVICE
    restart: always
    networks:
      - dkb_dev
    #ports:
    #  - 7331:7331
    environment:
      - DEBUG=${DEBUG:-0}
      - PRODIGY=${PRODIGY:-1}
      - LOCAL=${LOCAL:-1}
    depends_on:
      - rabbitmq_dev
    secrets:
      - VK_API_TOKEN
      - VK_GROUP_ID
    
  vk_daily_dev:
    container_name: social_rating_kraft_bot_vk_daily_dev
    build:
      context: ./VK_DAILY_SERVICE
    restart: always
    networks:
      - dkb_dev
    environment:
      - DEBUG=${DEBUG:-0}
      - PRODIGY=${PRODIGY:-1}
      - LOCAL=${LOCAL:-1}
    depends_on:
      - db_dev
      - rabbitmq_dev

  event_handler_dev:
    container_name: event_handler_dev
    build:
      context: ./EVENT_HANDLER_SERVICE
    restart: always
    networks:
      - dkb_dev
    environment:
      - DEBUG=${DEBUG:-0}
      - PRODIGY=${PRODIGY:-1}
      - LOCAL=${LOCAL:-1}
    depends_on:
      - db_dev
      - rabbitmq_dev

  vk_api_event_dev:
    container_name: vk_api_event_dev
    build:
      context: ./VK_API_EVENT_SERVICE
    restart: always
    networks:
      - dkb_dev
    environment:
      - DEBUG=${DEBUG:-0}
      - PRODIGY=${PRODIGY:-1}
      - LOCAL=${LOCAL:-1}
    depends_on:
      - db_dev
      - rabbitmq_dev
    secrets:
      - VK_API_TOKEN
      - VK_GROUP_ID

  tg_api_event_dev:
    container_name: tg_api_event_dev
    build:
      context: ./TG_API_EVENT_SERVICE
    restart: always
    networks:
      - dkb_dev
    environment:
      - DEBUG=${DEBUG:-0}
      - PRODIGY=${PRODIGY:-1}
      - LOCAL=${LOCAL:-1}
    depends_on:
      - db_dev
      - rabbitmq_dev
    secrets:
      - TG_API_TOKEN

      
  prometheus:
    image: prom/prometheus
    volumes:
      - prometheus-data:/etc/prometheus
    ports:
      - 9090:9090
    networks:
      - dkb_dev

  grafana:
    image: grafana/grafana
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - 3000:3000
    env_file:
      - .env
    networks:
      - dkb_dev
    depends_on:
      - prometheus

networks:
  dkb_dev:
    driver: bridge

volumes:
  db-data:
  dump-db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./DB_SERVICE
  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./GRAPHANA
  prometheus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./PROMETHEUS

secrets:
  POSTGRES_PW:
    file: ./POSTGRES_PW.txt
  VK_API_TOKEN:
    file: ./VK_API_TOKEN.txt
  VK_GROUP_ID:
    file: ./VK_GROUP_ID.txt
  TG_API_TOKEN:
    file: ./TG_API_TOKEN.txt
